<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JAVA学習ゲーム</title>
	<link rel="stylesheet" href="/game.css">
</head>
<body>
	<main class="page">
		<header class="page-header">
			<p class="eyebrow">JAVA LEARNING SYSTEM</p>
			<h1>JAVA学習ゲーム</h1>
			<p>問題を読んで、Javaの知識を身につけよう。</p>
		</header>

		<section class="panel start-panel" aria-labelledby="start-title">
			<h2 id="start-title">冒険の準備</h2>
			<div class="form-row">
				<label for="chapter-select">学習テーマ</label>
				<select id="chapter-select" disabled>
					<option>学習テーマを読み込み中...</option>
				</select>
			</div>
			<button class="primary-button" id="start-button" type="button" disabled>
				5問のゲームを始める
			</button>
		</section>

		<p class="notice" id="message" role="status" aria-live="polite">
			サーバーから学習テーマを読み込んでいます。
		</p>

		<section class="panel game-panel" id="game-panel" hidden aria-labelledby="question-title">
			<div class="game-status">
				<span id="question-progress">Stage 1 · 問題 1 / 5</span>
				<span id="score-status">スコア 0</span>
				<span id="enemy-status">敵HP 5</span>
				<span id="combo-status">Combo 0</span>
				<span id="timer-status" role="timer">開始前</span>
			</div>
			<div class="question-heading">
				<p class="eyebrow" id="question-type">問題</p>
				<h2 id="question-title"></h2>
			</div>
			<pre class="code-block" id="code-block" hidden><code></code></pre>
			<div class="choices-heading">選択肢</div>
			<ol class="choices" id="choices"></ol>
			<button class="primary-button" id="start-question-button" type="button" hidden>
				Enter またはクリックで問題開始
			</button>
			<section class="answer-result" id="answer-result" hidden aria-live="polite">
				<h3 id="answer-result-title"></h3>
				<p id="answer-result-details"></p>
				<p id="answer-explanation"></p>
				<button class="primary-button" id="next-question-button" type="button" hidden>
					次の問題へ
				</button>
			</section>
			<details class="explanation">
				<summary>問題の短い解説を見る</summary>
				<p id="short-explanation"></p>
			</details>
			<p class="game-note">
				Enterでタイマーを開始します。単一選択はA～Gキーまたは選択肢のクリック、複数選択はA～Gキーまたはクリックで選び、Enterで確定します。
			</p>
		</section>

		<footer>学習テーマ・問題・選択肢はゲームAPIから読み込みます。</footer>
	</main>
	<script src="/game.js" defer></script>
</body>
</html>
